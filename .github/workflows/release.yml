# Production release. Fires on a v* tag only — never on a branch push.
#
# A tag is an explicit human decision and an immutable rollback target (the
# protect-release-tags ruleset forbids moving or deleting one). Merging to main
# does not deploy; tagging does.
#
# Backend goes first and the frontend follows in the same job, because the
# backend owns the contract and every backend change is expected to be backward
# compatible for one release (CI-CD-Plan, release ordering).
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Hardcoded rather than derived from github.repository, which is mixed-case
  # (ttssoftwaress/Marty-Global-LLC) and container registries reject uppercase.
  # This must stay identical to REPO in /opt/marty/deploy.sh.
  REGISTRY_REPO: ghcr.io/ttssoftwaress/marty-global-llc

jobs:
  build-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the bare commit SHA, no prefix. deploy.sh pulls
      # "<repo>/backend:<sha>" literally, so a "sha-" prefix here would make
      # every deploy fail at docker pull.
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          push: true
          tags: ${{ env.REGISTRY_REPO }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migration runner
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: migrate
          push: true
          tags: ${{ env.REGISTRY_REPO }}/migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-images
    runs-on: ubuntu-24.04
    # Pauses here for the required reviewer. One environment, one approval,
    # covering both halves of the release.
    environment: production
    steps:
      # --- backend -------------------------------------------------------
      # Plain ssh rather than a third-party action, because the server pins a
      # forced command in authorized_keys: whatever is sent arrives as
      # SSH_ORIGINAL_COMMAND and deploy.sh strips it to [:alnum:].- before use.
      # Sending anything but the bare SHA would be mangled into nonsense.
      - name: Deploy the backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "deploy@$DEPLOY_HOST" "${{ github.sha }}"

      # --- frontend ------------------------------------------------------
      # Only after the API is live and smoke-tested. deploy.sh exits non-zero
      # and rolls itself back on failure, so a bad backend stops the release
      # here rather than shipping a bundle that calls an API that isn't there.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Every VITE_* is compile-time — baked into the bundle, not read at
      # runtime. One build per environment, and the values must come from the
      # same place as the backend's or the two apps drift.
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

      # A bundle built with a missing VITE_API_URL calls its own origin and
      # fails for every user, with no build error. Cheap to assert, expensive
      # to discover in production.
      - name: Confirm the API origin was baked in
        working-directory: frontend
        run: grep -rq "api.martygloballlc.com" dist/assets/ || { echo "VITE_API_URL missing from bundle"; exit 1; }

      - name: Upload to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=marty-global --branch=main

      - name: Verify production is answering
        run: |
          curl -fsS https://api.martygloballlc.com/v1/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://api.martygloballlc.com/v1/services)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://martygloballlc.com/app/billing)" = "200"
